name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<9" "coverage>=7.6,<8"
      - run: python -m coverage run -m pytest
      - run: python -m coverage report --fail-under=90
      - run: python -m py_compile src/tail_momentum_selector.py $(find src/quant_agent -name '*.py')
