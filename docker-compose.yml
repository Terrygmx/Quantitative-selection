# Single-machine compose (DETAILED_DESIGN section 9). The paper runner is
# the only long-lived service; it fails closed without an approval ledger.
services:
  paper:
    build: .
    image: quant-selection:paper
    working_dir: /app
    command:
      - python
      - -m
      - quant_agent.cli.paper
      - --approvals
      - /app/state/paper-approvals.json
      - run
      - --strategy
      - tail_momentum_overnight
      - --config
      - /app/configs/strategies/tail_momentum.json
      - --dry-run
    volumes:
      - paper-state:/app/state
    environment:
      PYTHONPATH: /app/src
    restart: "no"

volumes:
  paper-state:
